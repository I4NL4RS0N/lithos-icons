name: Icon agents
# Adds and refines icons with no human in the loop. See SPEC.md §9 and scripts/agents/run.mjs.
on:
  schedule:
    - cron: '17 9 * * *'   # daily: add new icons
    - cron: '43 13 * * 0'  # Sundays: refine the weakest icons (flagged ones first)
    - cron: '7 11 * * *'   # daily: review icons nobody has judged yet (anyone's), oldest review next
  workflow_dispatch:
    inputs:
      mode:
        description: add, refine or review
        default: add
        type: choice
        options: [add, refine, review]
      count:
        description: How many icons to attempt
        default: '10'
      focus:
        description: Only scout this standard's titles (for example fitch-2020); no topics
        default: ''
      max_usd:
        description: Spend cap for this run in USD (blank = repo variable or 30)
        default: ''
      dry_run:
        description: Judge and report only; commit nothing
        default: false
        type: boolean
permissions:
  contents: write
concurrency:
  group: icon-agents
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      NOUN_PROJECT_KEY: ${{ secrets.NOUN_PROJECT_KEY }}
      NOUN_PROJECT_SECRET: ${{ secrets.NOUN_PROJECT_SECRET }}
      ICONFINDER_KEY: ${{ secrets.ICONFINDER_KEY }}
      MAX_USD_PER_RUN: ${{ inputs.max_usd || vars.MAX_USD_PER_RUN || '30' }}
      FOCUS: ${{ inputs.focus || '' }}
      # Priority window: half Fitch titles, half topics, until this date (inclusive); then all standards again. A focus typed into a manual run overrides it.
      PRIORITY: fitch-2020+topics
      PRIORITY_UNTIL: '2026-12-18'
      MODE: ${{ inputs.mode || (github.event.schedule == '43 13 * * 0' && 'refine' || github.event.schedule == '7 11 * * *' && 'review' || 'add') }}
      COUNT: ${{ inputs.count || (github.event.schedule == '43 13 * * 0' && '3' || github.event.schedule == '7 11 * * *' && '10' || '10') }}
      DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
      PARALLEL: ${{ vars.PARALLEL || '4' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - run: npm ci
      - run: npm install -g @anthropic-ai/claude-code
      - name: Identify as the agents
        run: |
          git config user.name "lithos-icon-agents"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Run agents
        run: node scripts/agents/run.mjs "$MODE" "$COUNT"
      - name: Publish
        if: env.DRY_RUN != '1'
        run: |
          git reset -q --hard HEAD
          if [ "$(git rev-list --count origin/main..HEAD)" = "0" ]; then echo "nothing to publish"; exit 0; fi
          npm run build && npm run validate
          git diff --exit-code -- icons data/concepts data/index.json
          # Another run may have pushed meanwhile. Rebase onto it, merging log.json from both sides.
          # If that still fails, push the work to a branch so a finished run is never lost.
          ok=0
          for i in 1 2 3; do
            git fetch -q origin main
            git rebase origin/main || while [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; do
              node scripts/agents/merge-log.mjs && git add data/agents && GIT_EDITOR=true git rebase --continue || { git rebase --abort; break; }
            done
            if [ ! -d .git/rebase-merge ] && [ -z "$(git status --porcelain --untracked-files=no)" ] && git push origin HEAD:main; then ok=1; break; fi
          done
          if [ "$ok" != "1" ]; then
            git rebase --abort 2>/dev/null || true
            git push origin "HEAD:refs/heads/agent-run-$GITHUB_RUN_ID"
            echo "::error::Could not merge to main; the work is on branch agent-run-$GITHUB_RUN_ID"
            exit 1
          fi
